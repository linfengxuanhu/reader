name: daily_reader
description: A simple EPUB reader.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  archive: ^3.4.9
  file_picker: ^8.0.0
  html: ^0.15.4
  shared_preferences: ^2.2.0
  xml: ^6.5.0
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
